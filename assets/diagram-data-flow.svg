<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img">
  <title>Sentinel data flow</title>
  <desc>Horizontal data flow from signals through the core to proof, with subsystems as swimlanes.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5573"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#05070f"/>
  <g fill="none" stroke="#1b2340" stroke-width="1" opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="48" x2="1200" y2="48"/>
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="48" y2="400" x2="0"/>
    <line x1="48" y1="48" y2="400" x2="48"/>
    <line x1="96" y1="48" y2="400" x2="96"/>
    <line x1="144" y1="48" y2="400" x2="144"/>
    <line x1="192" y1="48" y2="400" x2="192"/>
    <line x1="240" y1="48" y2="400" x2="240"/>
    <line x1="288" y1="48" y2="400" x2="288"/>
    <line x1="336" y1="48" y2="400" x2="336"/>
    <line x1="384" y1="48" y2="400" x2="384"/>
    <line x1="432" y1="48" y2="400" x2="432"/>
    <line x1="480" y1="48" y2="400" x2="480"/>
    <line x1="528" y1="48" y2="400" x2="528"/>
    <line x1="576" y1="48" y2="400" x2="576"/>
    <line x1="624" y1="48" y2="400" x2="624"/>
    <line x1="672" y1="48" y2="400" x2="672"/>
    <line x1="720" y1="48" y2="400" x2="720"/>
    <line x1="768" y1="48" y2="400" x2="768"/>
    <line x1="816" y1="48" y2="400" x2="816"/>
    <line x1="864" y1="48" y2="400" x2="864"/>
    <line x1="912" y1="48" y2="400" x2="912"/>
    <line x1="960" y1="48" y2="400" x2="960"/>
    <line x1="1008" y1="48" y2="400" x2="1008"/>
    <line x1="1056" y1="48" y2="400" x2="1056"/>
    <line x1="1104" y1="48" y2="400" x2="1104"/>
    <line x1="1152" y1="48" y2="400" x2="1152"/>
  </g>
  <rect width="1200" height="400" fill="#05070f"/>
  <text x="40" y="36" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#7c88a8">SENTINEL · DATA FLOW</text>

  <rect x="40" y="60" width="1120" height="90" rx="8" fill="#0b0f1c" stroke="#1b2340"/>
  <text x="56" y="90" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#5aa9ff">MARKET DATA</text>
  <text x="56" y="122" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Perpl WS → marks → Reflex engine → tier → Policy gate → Execution</text>

  <rect x="40" y="170" width="1120" height="90" rx="8" fill="#0b0f1c" stroke="#1b2340"/>
  <text x="56" y="200" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#a06cf0">INTEL + AI</text>
  <text x="56" y="232" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Nansen x402 → cached → Qwen primary / Kimi fallback → strict JSON → proposal → Policy gate</text>

  <rect x="40" y="280" width="1120" height="90" rx="8" fill="#0b0f1c" stroke="#1b2340"/>
  <text x="56" y="310" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#a06cf0">PROOF</text>
  <text x="56" y="342" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Intent → Journal (hash-chained) → Inference archive → Policy fingerprint → Merkle batch → Monad anchor → Envio indexer</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5573"/>
    </marker>
  </defs>
  <path d="M180 150 L180 170" fill="none" stroke="#4ff0d0" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M180 260 L180 280" fill="none" stroke="#a06cf0" stroke-width="2.2" marker-end="url(#ah)"/>
</svg>