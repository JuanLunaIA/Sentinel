<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img">
  <title>Sentinel risk tiers</title>
  <desc>Four levels of distance to liquidation, from green through yellow and orange to red, with the action taken at each.</desc>
  <defs>
    <linearGradient id="tAxis" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3ddc97"/><stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="560" fill="#05070f"/>
  <text x="60" y="66" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#7c88a8">SENTINEL &#183; HOW IT DECIDES</text>
  <text x="60" y="104" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" fill="#e8ecf8">One measurement per position per tick: how much room is left before liquidation.</text>
  <g><rect x="60" y="150" width="294" height="72" rx="8" fill="#3ddc97" opacity="0.16" stroke="#3ddc97" stroke-width="1.6"/><text x="82" y="181" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#3ddc97">GREEN</text><text x="82" y="206" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">&#8805; 25% from liquidation</text><text x="376" y="194" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#e8ecf8">nothing to do</text></g><g><rect x="60" y="238" width="235" height="72" rx="8" fill="#ffb020" opacity="0.16" stroke="#ffb020" stroke-width="1.6"/><text x="82" y="269" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#ffb020">YELLOW</text><text x="82" y="294" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">15 &#8211; 25% from liquidation</text><text x="317" y="282" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#e8ecf8">watch, consult the brain</text></g><g><rect x="60" y="326" width="235" height="72" rx="8" fill="#ff4d5e" opacity="0.16" stroke="#ff4d5e" stroke-width="1.6"/><text x="82" y="357" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#ff4d5e">ORANGE</text><text x="82" y="382" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">8 &#8211; 15% from liquidation</text><text x="317" y="370" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#e8ecf8">act: reduce by 25%</text></g><g><rect x="60" y="414" width="216" height="72" rx="8" fill="#ff4d5e" opacity="0.16" stroke="#ff4d5e" stroke-width="1.6"/><text x="82" y="445" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#ff4d5e">RED</text><text x="82" y="470" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">&lt; 8% from liquidation</text><text x="298" y="458" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#e8ecf8">act: reduce by 50%, escalate</text></g>
  <rect x="60" y="508" width="980" height="6" rx="3" fill="url(#tAxis)"/>
  <text x="60" y="486" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" fill="#7c88a8">FAR FROM LIQUIDATION</text>
  <text x="1040" y="486" text-anchor="end" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" fill="#ff4d5e">NO ROOM</text>
  <text x="1074" y="513" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#4a5573">predicts nothing</text>
</svg>