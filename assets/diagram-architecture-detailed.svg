  <rect width="2000" height="1200" fill="#05070f"/>
  <text x="80" y="70" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" letter-spacing="2" fill="#7c88a8">SENTINEL · COMPLETE DECISION PATH</text>
  <text x="80" y="108" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#4a5573">Two rules are structural: the reflex path never calls a model, and a model never bypasses the policy gate.</text>

  <text x="80" y="170" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#5aa9ff">EXTERNAL SIGNALS</text>
  <rect x="80" y="190" width="300" height="90" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="84" y="190" width="4" height="90" rx="2" fill="#5aa9ff"/>
  <text x="104" y="214" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Perpl REST + WS</text>
  <text x="104" y="239" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">marks, funding, positions, order flow</text>
  <rect x="410" y="190" width="300" height="90" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="414" y="190" width="4" height="90" rx="2" fill="#a06cf0"/>
  <text x="434" y="214" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Nansen via x402</text>
  <text x="434" y="239" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">paid intel, cached + capped at 40/hr</text>
  <rect x="720" y="190" width="300" height="90" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="724" y="190" width="4" height="90" rx="2" fill="#a06cf0"/>
  <text x="744" y="214" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Dual brain: Qwen + Kimi</text>
  <text x="744" y="239" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">strict JSON, failover tested</text>
  <rect x="1030" y="190" width="300" height="90" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1034" y="190" width="4" height="90" rx="2" fill="#ffb020"/>
  <text x="1054" y="214" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Telegram</text>
  <text x="1054" y="239" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">human approval, alerts</text>

  <rect x="60" y="330" width="1880" height="280" rx="16" fill="#0e1424" stroke="#4ff0d0" stroke-width="1.8" stroke-dasharray="10 8"/>
  <text x="80" y="320" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="1.8" fill="#4ff0d0">DETERMINISTIC CORE — NO NETWORK, NO MODEL, NO UNSAFE CODE</text>
  <rect x="100" y="370" width="350" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="104" y="370" width="4" height="96" rx="2" fill="#4ff0d0"/>
  <text x="124" y="394" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Reflex risk engine</text>
  <text x="124" y="419" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">distance-to-liq from first principles
0.271 µs/iter · pure function</text>
  <rect x="480" y="370" width="320" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="484" y="370" width="4" height="96" rx="2" fill="#4ff0d0"/>
  <text x="504" y="394" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Tier classifier</text>
  <text x="504" y="419" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">Green ≥25% — Yellow 15–25% — Orange 8–15% — Red &lt;8%</text>
  <rect x="830" y="370" width="320" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="834" y="370" width="4" height="96" rx="2" fill="#4ff0d0"/>
  <text x="854" y="394" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Policy gate</text>
  <text x="854" y="419" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">caps, allowlist, approval, idempotency, kill switch</text>
  <rect x="1180" y="370" width="350" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1184" y="370" width="4" height="96" rx="2" fill="#4ff0d0"/>
  <text x="1204" y="394" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Guarded execution</text>
  <text x="1204" y="419" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">reduce-only, idempotent retries, approval queue</text>
  <rect x="1560" y="370" width="350" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1564" y="370" width="4" height="96" rx="2" fill="#4ff0d0"/>
  <text x="1584" y="394" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Adaptive bands (opt-in)</text>
  <text x="1584" y="419" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">EWMA vol + regime, opt-in via --adaptive</text>

  <rect x="60" y="550" width="1880" height="120" rx="12" fill="#0e1424" stroke="#a06cf0" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="80" y="540" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.6" fill="#a06cf0">PORTFOLIO LAYER (opt-in, --cascade)</text>
  <rect x="100" y="578" width="350" height="72" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="104" y="578" width="4" height="72" rx="2" fill="#a06cf0"/>
  <text x="124" y="598" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Correlation tracker</text>
  <text x="124" y="623" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">EWMA λ=0.94 · pairwise covariance</text>
  <rect x="480" y="578" width="320" height="72" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="484" y="578" width="4" height="72" rx="2" fill="#a06cf0"/>
  <text x="504" y="598" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Equity-at-risk</text>
  <text x="504" y="623" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">collateral × P(liq) ≤ naive sum</text>
  <rect x="830" y="578" width="320" height="72" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="834" y="578" width="4" height="72" rx="2" fill="#a06cf0"/>
  <text x="854" y="598" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Cascade planner</text>
  <text x="854" y="623" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">survival/fee × concentration</text>
  <rect x="1180" y="578" width="350" height="72" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1184" y="578" width="4" height="72" rx="2" fill="#a06cf0"/>
  <text x="1204" y="598" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Budget reserve</text>
  <text x="1204" y="623" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">holds actions while correlated</text>
  <rect x="1560" y="578" width="350" height="72" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1564" y="578" width="4" height="72" rx="2" fill="#a06cf0"/>
  <text x="1584" y="598" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Segregation ([P-1])</text>
  <text x="1584" y="623" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">per-market + book ceiling</text>

  <text x="80" y="720" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="1.8" fill="#a06cf0">PROOF — EVERY DECISION, HASH-CHAINED, ANCHORED</text>
  <rect x="80" y="744" width="300" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="84" y="744" width="4" height="96" rx="2" fill="#a06cf0"/>
  <text x="104" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Audit journal</text>
  <text x="104" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">append-only · hash-chained · inference commitment</text>
  <rect x="410" y="744" width="280" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="414" y="744" width="4" height="96" rx="2" fill="#a06cf0"/>
  <text x="434" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Inference archive</text>
  <text x="434" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">replayable sidecar · inference-verify binary</text>
  <rect x="720" y="744" width="280" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="724" y="744" width="4" height="96" rx="2" fill="#a06cf0"/>
  <text x="744" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Policy fingerprint</text>
  <text x="744" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">SHA-256 of caps + allowlist · per intent</text>
  <rect x="1030" y="744" width="280" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1034" y="744" width="4" height="96" rx="2" fill="#a06cf0"/>
  <text x="1054" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Monad anchor</text>
  <text x="1054" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">SentinelAuditAnchor · batch Merkle</text>
  <rect x="1340" y="744" width="280" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1344" y="744" width="4" height="96" rx="2" fill="#a06cf0"/>
  <text x="1364" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Envio indexer</text>
  <text x="1364" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">HyperSync · public GraphQL</text>
  <rect x="1650" y="744" width="280" height="96" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/>
  <rect x="1654" y="744" width="4" height="96" rx="2" fill="#ff4d5e"/>
  <text x="1674" y="768" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">CRE dead-man</text>
  <text x="1674" y="793" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">de-risks if Sentinel stops</text>

  <rect x="80" y="910" width="1840" height="220" rx="12" fill="#0b0f1c" stroke="#1b2340" stroke-width="1.5"/>
  <text x="100" y="944" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.6" fill="#7c88a8">INVARIANTS (enforced by type system and tests)</text>
  <text x="100" y="976" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf8">1. Reflex core has ZERO network deps — no model can run in the protection path</text>
  <text x="100" y="1004" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf8">2. AI never bypasses the policy gate — proposals only, gate decides</text>
  <text x="100" y="1032" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf8">3. Journal written BEFORE action — audit-before-action, not after</text>
  <text x="100" y="1060" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf8">4. Secrets via SecretString only — redacting Debug, never in logs</text>
  <text x="100" y="1088" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#e8ecf8">5. DRY_RUN mode is first-class — every I/O behind mockable async traits</text>
</svg>
