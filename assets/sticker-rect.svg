  <text x="148" y="144" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="22" fill="#7c88a8">the verifiable AI risk guardian</text>
  <rect x="148" y="156" width="180" height="2" fill="#4ff0d0" opacity="0.7"/>
  <text x="148" y="200" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="20" fill="#e8ecf8">It measures one thing: how far a position can move</text>
