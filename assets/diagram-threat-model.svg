<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>Sentinel threat model (STRIDE)</title>
  <desc>Security threat model using STRIDE methodology for the Sentinel guardian system.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5573"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#05070f"/>
  <g fill="none" stroke="#1b2340" stroke-width="1" opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="48" x2="1200" y2="48"/>
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="144" x2="1200" y2="144"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="288" x2="1200" y2="288"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="432" x2="1200" y2="432"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="528" x2="1200" y2="528"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
    <line x1="0" y1="624" x2="1200" y2="624"/>
    <line x1="0" y1="672" x2="1200" y2="672"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="0" y1="768" x2="1200" y2="768"/>
    <line x1="48" y1="0" x2="48" y2="800"/>
    <line x1="96" y1="0" x2="96" y2="800"/>
    <line x1="144" y1="0" x2="144" y2="800"/>
    <line x1="192" y1="0" x2="192" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="288" y1="0" x2="288" y2="800"/>
    <line x1="336" y1="0" x2="336" y2="800"/>
    <line x1="384" y1="0" x2="384" y2="800"/>
    <line x1="432" y1="0" x2="432" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="528" y1="0" x2="528" y2="800"/>
    <line x1="576" y1="0" x2="576" y2="800"/>
    <line x1="624" y1="0" x2="624" y2="800"/>
    <line x1="672" y1="0" x2="672" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="768" y1="0" x2="768" y2="800"/>
    <line x1="816" y1="0" x2="816" y2="800"/>
    <line x1="864" y1="0" x2="864" y2="800"/>
    <line x1="912" y1="0" x2="912" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
    <line x1="1008" y1="0" x2="1008" y2="800"/>
    <line x1="1056" y1="0" x2="1056" y2="800"/>
    <line x1="1104" y1="0" x2="1104" y2="800"/>
    <line x1="1152" y1="0" x2="1152" y2="800"/>
  </g>
  <rect width="1200" height="800" fill="#05070f"/>
  <text x="60" y="54" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#7c88a8">SENTINEL · THREAT MODEL (STRIDE)</text>

  <!-- S: Spoofing -->
  <rect x="60" y="80" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#ff4d5e" stroke-width="2"/>
  <rect x="64" y="80" width="4" height="160" rx="2" fill="#ff4d5e"/>
  <text x="84" y="110" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#ff4d5e">S — SPOOFING</text>
  <text x="84" y="138" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Fake Perpl WS / REST endpoint</text>
  <text x="84" y="160" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ Mark price manipulation</text>
  <text x="84" y="182" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: TLS pinning, mTLS to Perpl, signature verification on marks</text>
  <text x="84" y="204" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: Reflex cross-checks mark against liquidation math</text>

  <!-- T: Tampering -->
  <rect x="630" y="80" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#ffb020" stroke-width="2"/>
  <rect x="634" y="80" width="4" height="160" rx="2" fill="#ffb020"/>
  <text x="654" y="110" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffb020">T — TAMPERING</text>
  <text x="654" y="138" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Journal or audit log modification</text>
  <text x="654" y="160" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ History rewrite</text>
  <text x="654" y="182" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: Hash-chained journal (each entry commits prev_hash)</text>
  <text x="654" y="204" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: Merkle batches anchored on Monad (immutable)</text>

  <!-- R: Repudiation -->
  <rect x="60" y="260" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#a06cf0" stroke-width="2"/>
  <rect x="64" y="260" width="4" height="160" rx="2" fill="#a06cf0"/>
  <text x="84" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#a06cf0">R — REPUDIATION</text>
  <text x="84" y="318" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Actor denies an action or decision</text>
  <text x="84" y="340" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ 'I never approved that reduce'</text>
  <text x="84" y="362" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: Non-repudiable Telegram approval (signed payloads)</text>
  <text x="84" y="384" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: Inference commitment (SHA-256 of prompt+params+completion)</text>

  <!-- I: Information Disclosure -->
  <rect x="630" y="260" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#5aa9ff" stroke-width="2"/>
  <rect x="634" y="260" width="4" height="160" rx="2" fill="#5aa9ff"/>
  <text x="654" y="290" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#5aa9ff">I — INFORMATION DISCLOSURE</text>
  <text x="654" y="318" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Secrets in logs, API keys, positions</text>
  <text x="654" y="340" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ Private key / API key leak</text>
  <text x="654" y="362" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: SecretString type with redacting Debug (never in logs)</text>
  <text x="654" y="384" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: DRY_RUN mode isolates all external I/O behind mocks</text>

  <!-- D: Denial of Service -->
  <rect x="60" y="440" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#ffb020" stroke-width="2"/>
  <rect x="64" y="440" width="4" height="160" rx="2" fill="#ffb020"/>
  <text x="84" y="470" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffb020">D — DENIAL OF SERVICE</text>
  <text x="84" y="498" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">Perpl API unavailable, AI providers down</text>
  <text x="84" y="520" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ Reflex engine cannot act</text>
  <text x="84" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: Reflex core has ZERO network deps — protects locally</text>
  <text x="84" y="564" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: Dual-brain failover (Qwen → Kimi), circuit breakers</text>

  <!-- E: Elevation of Privilege -->
  <rect x="630" y="440" width="540" height="160" rx="10" fill="#0b0f1c" stroke="#3ddc97" stroke-width="2"/>
  <rect x="634" y="440" width="4" height="160" rx="2" fill="#3ddc97"/>
  <text x="654" y="470" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="16" fill="#3ddc97">E — ELEVATION OF PRIVILEGE</text>
  <text x="654" y="498" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e8ecf8">AI bypasses policy, unauthorized execution</text>
  <text x="654" y="520" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12" fill="#7c88a8">→ Reduce 100% instead of 25%</text>
  <text x="654" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#4ff0d0">MITIGATION: Reflex never calls AI; AI only proposes, gate decides</text>
  <text x="654" y="564" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#a06cf0">MITIGATION: Policy gate is pure, typed, and tested adversarially</text>

  <!-- Cross-cutting mitigations -->
  <rect x="60" y="620" width="1080" height="150" rx="10" fill="#0e1424" stroke="#4ff0d0" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="80" y="650" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.6" fill="#4ff0d0">ARCHITECTURAL MITIGATIONS (cross-cutting)</text>
  <text x="80" y="682" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e8ecf8">1. Reflex core has ZERO network deps — no model can run in the protection path</text>
  <text x="80" y="706" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e8ecf8">2. AI never bypasses the policy gate — proposals only, gate decides</text>
  <text x="80" y="730" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e8ecf8">3. Journal written BEFORE action — audit-before-action, not after</text>
  <text x="80" y="754" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e8ecf8">4. Secrets via SecretString only — redacting Debug, never in logs</text>
  <text x="80" y="778" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e8ecf8">5. DRY_RUN mode is first-class — every I/O behind mockable async traits</text>

  <text x="60" y="40" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#7c88a8">SENTINEL · THREAT MODEL (STRIDE)</text>
</svg>