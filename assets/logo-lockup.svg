<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="256" viewBox="0 0 1024 256" role="img">
  <title>Sentinel lockup</title>
  <desc>The Sentinel mark beside the wordmark and descriptor.</desc>
  <defs>
    <linearGradient id="lMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ff0d0"/>
      <stop offset="0.55" stop-color="#19c7a8"/>
      <stop offset="1" stop-color="#a06cf0"/>
    </linearGradient>
    <linearGradient id="lRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ff0d0" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#a06cf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a06cf0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(56,40) scale(0.688)">
    <polygon points="128,32 211,80 211,176 128,224 45,176 45,80" fill="none" stroke="url(#lMark)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="128,68 180,98 180,158 128,188 76,158 76,98" fill="#0b0f1c" stroke="#2a3556" stroke-width="3" stroke-linejoin="round"/>
    <path d="M74 128 H101 L114 95 L138 161 L151 128 H182" fill="none"
          stroke="#4ff0d0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="248" y="122" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace"
        font-size="86" font-weight="700" letter-spacing="6" fill="#e8ecf8">SENTINEL<tspan fill="#a06cf0">_</tspan></text>
  <text x="252" y="168" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"
        font-size="27" letter-spacing="1.5" fill="#7c88a8">the verifiable AI risk guardian</text>
  <rect x="252" y="190" width="560" height="2" fill="url(#lRule)"/>
</svg>