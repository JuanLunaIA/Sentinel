<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img">
  <title>Sentinel decision lifecycle</title>
  <desc>Five steps from measurement to recorded outcome. The journal entry is written before the action, never after.</desc>
  <rect width="900" height="700" fill="#05070f"/>
  <text x="72" y="70" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#7c88a8">SENTINEL &#183; ONE DECISION</text>
  <text x="72" y="112" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="20" fill="#e8ecf8">The journal entry is written before the action, not after.</text>
  <text x="72" y="140" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#4a5573">That ordering is what makes the record evidence instead of a log.</text>
  <g><circle cx="120" cy="198" r="27" fill="#0b0f1c" stroke="#0fb894" stroke-width="2.4"/><text x="120" y="206" text-anchor="middle" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#0fb894">1</text><text x="176" y="192" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" letter-spacing="1.4" fill="#e8ecf8">MEASURE</text><text x="176" y="218" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16.5" fill="#7c88a8">distance to liquidation, every tick</text></g><line x1="120" y1="228" x2="120" y2="264" stroke="#2a3556" stroke-width="2.4"/><g><circle cx="120" cy="294" r="27" fill="#0b0f1c" stroke="#2f7fd8" stroke-width="2.4"/><text x="120" y="302" text-anchor="middle" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#2f7fd8">2</text><text x="176" y="288" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" letter-spacing="1.4" fill="#e8ecf8">CLASSIFY</text><text x="176" y="314" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16.5" fill="#7c88a8">green / yellow / orange / red</text></g><line x1="120" y1="324" x2="120" y2="360" stroke="#2a3556" stroke-width="2.4"/><g><circle cx="120" cy="390" r="27" fill="#0b0f1c" stroke="#7c4de0" stroke-width="2.4"/><text x="120" y="398" text-anchor="middle" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#7c4de0">3</text><text x="176" y="384" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" letter-spacing="1.4" fill="#e8ecf8">AUDIT</text><text x="176" y="410" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16.5" fill="#7c88a8">write the intent and its hash, BEFORE acting</text></g><line x1="120" y1="420" x2="120" y2="456" stroke="#2a3556" stroke-width="2.4"/><g><circle cx="120" cy="486" r="27" fill="#0b0f1c" stroke="#c07800" stroke-width="2.4"/><text x="120" y="494" text-anchor="middle" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#c07800">4</text><text x="176" y="480" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" letter-spacing="1.4" fill="#e8ecf8">GATE</text><text x="176" y="506" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16.5" fill="#7c88a8">policy decides: allow, deny, or ask a human</text></g><line x1="120" y1="516" x2="120" y2="552" stroke="#2a3556" stroke-width="2.4"/><g><circle cx="120" cy="582" r="27" fill="#0b0f1c" stroke="#1f9d63" stroke-width="2.4"/><text x="120" y="590" text-anchor="middle" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#1f9d63">5</text><text x="176" y="576" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="19" font-weight="700" letter-spacing="1.4" fill="#e8ecf8">ACT + RECORD</text><text x="176" y="602" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="16.5" fill="#7c88a8">execute, then append the outcome</text></g>
  <rect x="72" y="648" width="760" height="1.6" fill="#2a3556"/>
  <text x="72" y="680" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">a crash between step 3 and step 5 leaves the intent on record with no outcome, which is the honest state</text>
</svg>