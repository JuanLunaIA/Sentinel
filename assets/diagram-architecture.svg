<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img">
  <title>Sentinel architecture</title>
  <desc>Signals enter from three sources. A deterministic core measures risk, gates and executes. Every action is journaled, anchored and published.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5573"/>
    </marker>
  </defs>
  <rect width="1400" height="660" fill="#05070f"/>

  <text x="56" y="52" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="2" fill="#7c88a8">SENTINEL &#183; DECISION PATH</text>
  <text x="56" y="82" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#4a5573">Two rules are structural: the reflex path never calls a model, and a model never bypasses the policy gate.</text>

  <!-- inputs -->
  <text x="56" y="132" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.8" fill="#5aa9ff">SIGNALS</text>
  <rect x="56" y="146" width="300" height="74" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="56" y="146" width="4" height="74" rx="2" fill="#5aa9ff"/><text x="76" y="177" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Perpl REST + WS feed</text><text x="76" y="202" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">marks, funding, positions</text>
  <rect x="384" y="146" width="300" height="74" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="384" y="146" width="4" height="74" rx="2" fill="#a06cf0"/><text x="404" y="177" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Nansen via x402</text><text x="404" y="202" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">paid intel, cached + capped</text>
  <rect x="712" y="146" width="300" height="74" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="712" y="146" width="4" height="74" rx="2" fill="#a06cf0"/><text x="732" y="177" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Dual brain</text><text x="732" y="202" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">Qwen primary, Kimi fallback</text>
  <rect x="1040" y="146" width="300" height="74" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="1040" y="146" width="4" height="74" rx="2" fill="#ffb020"/><text x="1060" y="177" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Telegram</text><text x="1060" y="202" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">human approval, alerts</text>

  <!-- deterministic core -->
  <rect x="44" y="266" width="1312" height="150" rx="14" fill="#0e1424" stroke="#4ff0d0" stroke-width="1.6" stroke-dasharray="8 7"/>
  <text x="56" y="252" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.8" fill="#4ff0d0">DETERMINISTIC CORE &#8212; NO MODEL IN THIS PATH</text>
  <rect x="68" y="300" width="320" height="84" rx="10" fill="#0b0f1c" stroke="#4ff0d0" stroke-width="1.8"/><rect x="68" y="300" width="4" height="84" rx="2" fill="#4ff0d0"/><text x="88" y="336" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Reflex risk engine</text><text x="88" y="361" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">0.271 &#181;s/iteration, pure</text>
  <rect x="444" y="300" width="264" height="84" rx="10" fill="#0b0f1c" stroke="#4ff0d0" stroke-width="1.8"/><rect x="444" y="300" width="4" height="84" rx="2" fill="#4ff0d0"/><text x="464" y="336" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Policy gate</text><text x="464" y="361" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">caps, allowlist, approve</text>
  <rect x="764" y="300" width="280" height="84" rx="10" fill="#0b0f1c" stroke="#4ff0d0" stroke-width="1.8"/><rect x="764" y="300" width="4" height="84" rx="2" fill="#4ff0d0"/><text x="784" y="336" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Guarded execution</text><text x="784" y="361" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">reduce-only, idempotent</text>
  <rect x="1100" y="300" width="232" height="84" rx="10" fill="#0b0f1c" stroke="#4ff0d0" stroke-width="1.8"/><rect x="1100" y="300" width="4" height="84" rx="2" fill="#ff4d5e"/><text x="1120" y="336" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Kill switch</text><text x="1120" y="361" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">operator, always available</text>

  <path d="M356 224 C 356 260.0, 200 260.0, 200 296" fill="none" stroke="#5aa9ff" stroke-width="2.2" marker-end="url(#ah)"/><text x="340" y="206" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">tick</text>
  <path d="M534 224 C 534 260.0, 470 260.0, 470 296" fill="none" stroke="#a06cf0" stroke-width="2.2" marker-end="url(#ah)"/><text x="546" y="204" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">context</text>
  <path d="M862 224 L860 296" fill="none" stroke="#a06cf0" stroke-width="2.2" marker-end="url(#ah)"/><text x="874" y="218" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">proposal</text>
  <path d="M1190 224 L1180 296" fill="none" stroke="#ffb020" stroke-width="2.2" marker-end="url(#ah)"/><text x="1202" y="218" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">approval</text>
  <path d="M388 342 L444 342" fill="none" stroke="#4ff0d0" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M708 342 L764 342" fill="none" stroke="#4ff0d0" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M1044 342 L1100 342" fill="none" stroke="#4ff0d0" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- proof -->
  <text x="56" y="472" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="1.8" fill="#a06cf0">PROOF &#8212; EVERY DECISION, HASH-CHAINED</text>
  <rect x="56" y="486" width="320" height="84" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="56" y="486" width="4" height="84" rx="2" fill="#a06cf0"/><text x="76" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Audit journal</text><text x="76" y="547" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">hash-chained, append-only</text>
  <rect x="404" y="486" width="268" height="84" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="404" y="486" width="4" height="84" rx="2" fill="#a06cf0"/><text x="424" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Monad anchor</text><text x="424" y="547" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">SentinelAuditAnchor</text>
  <rect x="700" y="486" width="268" height="84" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="700" y="486" width="4" height="84" rx="2" fill="#a06cf0"/><text x="720" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">Envio indexer</text><text x="720" y="547" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">public queries</text>
  <rect x="996" y="486" width="344" height="84" rx="10" fill="#0b0f1c" stroke="#2a3556" stroke-width="1.8"/><rect x="996" y="486" width="4" height="84" rx="2" fill="#ff4d5e"/><text x="1016" y="522" font-family="'DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e8ecf8">CRE dead-man switch</text><text x="1016" y="547" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#7c88a8">de-risks if Sentinel stops</text>

