  <path d="M672 528 L700 528" fill="none" stroke="#a06cf0" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M968 528 L996 528" fill="none" stroke="#a06cf0" stroke-width="2.2" marker-end="url(#ah)"/>
  <path d="M1168 486 L1168 420" fill="none" stroke="#ff4d5e" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="1180" y="466" font-family="'DejaVu Sans Mono','Liberation Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#4a5573">reads</text>
</svg>