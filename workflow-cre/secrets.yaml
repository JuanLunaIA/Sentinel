# ==========================================================================
# Secrets manifest (project root) — read by `cre workflow simulate` for local
# runs via the `secrets-path` field in sentinel-deadman/workflow.yaml.
# ==========================================================================
# Logical name (used by the workflow code) -> environment variable(s) that
# carry the value during simulation (from the shell or the project `.env`).
# Copy `.env.example` to `.env` and set real values; never commit `.env`.
#
# For DEPLOYED workflows the values live in the Vault DON instead:
#   cre secrets create / update  (see docs.chain.link/cre → Secrets).
# ==========================================================================
secretsNames:
  BREAKER_ARM_SECRET:
    - BREAKER_ARM_SECRET
  TELEGRAM_BOT_TOKEN:
    - TELEGRAM_BOT_TOKEN
